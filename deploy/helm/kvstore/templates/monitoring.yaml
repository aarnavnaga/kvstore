{{- if .Values.monitoring.enabled }}
{{- $name := include "kvstore.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-prometheus
  labels: {{- include "kvstore.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: kvstore
        static_configs:
          - targets:
            {{- range $i := until (int .Values.replicas) }}
              - {{ include "kvstore.podHost" (list $ $i) }}:9100
            {{- end }}
        relabel_configs:
          # Label each series with its pod name (kvstore-0, ...), not the long DNS name.
          - source_labels: [__address__]
            regex: '([^.]+)\..*'
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-prometheus
  labels: {{- include "kvstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }}-prometheus }
  template:
    metadata:
      labels: { app: {{ $name }}-prometheus }
      annotations:
        checksum/config: {{ .Values.replicas | toString | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534 }
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes:
        - name: config
          configMap: { name: {{ $name }}-prometheus }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-prometheus
  labels: {{- include "kvstore.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $name }}-prometheus }
  ports: [{ name: http, port: 9090 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-grafana
  labels: {{- include "kvstore.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://{{ $name }}-prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: kvstore
        folder: kvstore
        type: file
        options: { path: /var/lib/grafana/dashboards }
  kvstore.json: |
{{ .Files.Get "dashboards/kvstore.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-grafana
  labels: {{- include "kvstore.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }}-grafana }
  template:
    metadata:
      labels: { app: {{ $name }}-grafana }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage }}
          env:
            # A local demo dashboard: anonymous viewers, no login.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/kvstore.json }
          ports: [{ name: http, containerPort: 3000 }]
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml }
            - { name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: config, mountPath: /var/lib/grafana/dashboards/kvstore.json, subPath: kvstore.json }
      volumes:
        - name: config
          configMap: { name: {{ $name }}-grafana }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-grafana
  labels: {{- include "kvstore.labels" . | nindent 4 }}
spec:
  selector: { app: {{ $name }}-grafana }
  ports: [{ name: http, port: 3000 }]
{{- end }}
