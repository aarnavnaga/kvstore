{{- if .Values.tls.enabled }}
{{- /*
The cluster's private CA and certificate, generated once. On upgrade the existing
Secret is looked up and reused: regenerating it would leave running nodes and
clients with certificates from a CA nobody trusts any more.
*/ -}}
{{- $name := printf "%s-tls" (include "kvstore.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "kvstore.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
  {{- $days := int .Values.tls.certValidityDays -}}
  {{- $ca := genCA "kvstore-ca" $days -}}
  {{- $hosts := list (include "kvstore.fullname" .) (printf "*.%s.%s.svc.cluster.local" (include "kvstore.headless" .) .Release.Namespace) (printf "%s.%s.svc.cluster.local" (include "kvstore.fullname" .) .Release.Namespace) "localhost" -}}
  {{- $cert := genSignedCert "kvstore" (list "127.0.0.1") $hosts $days $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
