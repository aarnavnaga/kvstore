name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan, tsan]
        include:
          - mode: release
            flags: -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - mode: asan
            flags: -DCMAKE_BUILD_TYPE=Debug -DKV_SANITIZER=address
          - mode: tsan
            flags: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DKV_SANITIZER=thread
    env:
      CC: clang-18
      CXX: clang++-18
      # A TSan or ASan report fails the run instead of being printed and ignored.
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      ASAN_OPTIONS: halt_on_error=1 detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev llvm-18 \
            ninja-build libssl-dev libgtest-dev libgmock-dev zlib1g-dev
      - name: Lower ASLR entropy for TSan
        # Kernels with 32 bits of mmap randomness break TSan's shadow memory layout.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)" --timeout 900

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-format-18 clang-tidy-18 \
            ninja-build libssl-dev libgtest-dev libgmock-dev zlib1g-dev
      - name: clang-format
        run: |
          find src tests fuzz bench chaos \( -name '*.cc' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format-18 --dry-run --Werror
      - name: clang-tidy
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -G Ninja -DKV_BUILD_TESTS=OFF
          find src -name '*.cc' -print0 | xargs -0 -r clang-tidy-18 -p build --quiet
